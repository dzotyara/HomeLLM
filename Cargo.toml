[workspace]
resolver = "3"
members = ["crates/homellm-core", "crates/homellm-cli", "crates/homellm-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dzotyara/HomeLLM"

[workspace.dependencies]
anyhow = "1"
arboard = "3.6"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
enigo = "0.6"
futures-util = "0.3"
llama-cpp-2 = "0.1.157"
open = "5"
regex = "1"
reqwest = { version = "0.13", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = "0.39"
tokio = { version = "1", features = ["full"] }
