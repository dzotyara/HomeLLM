name: Release

# Push a tag like v0.1.0 (or run by hand): installers for Windows, Linux and macOS
# land in a draft GitHub release to check and publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and Linux runners have no Vulkan SDK: CPU builds for now.
          - os: windows-latest
            cargo_args: --no-default-features
          - os: ubuntu-22.04
            cargo_args: --no-default-features
          # macOS gets Metal out of the box.
          - os: macos-latest
            cargo_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Windows only: an empty LIBCLANG_PATH elsewhere makes bindgen look nowhere else
      # («Unable to find libclang ... invalid: []»).
      - name: libclang
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libclang-dev patchelf
      - name: Build installers
        working-directory: crates/homellm-app
        shell: bash
        run: npx --yes @tauri-apps/cli@2.12.0 build -- ${{ matrix.cargo_args }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: HomeLLM ${{ github.ref_name }}
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/dmg/*.dmg
