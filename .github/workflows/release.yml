name: Release

# Push a tag like v0.1.0 (or run by hand): installers for Windows, Linux and macOS
# land in a draft GitHub release to check and publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and Linux runners have no Vulkan SDK: CPU builds for now.
          - os: windows-latest
            cargo_args: --no-default-features
          - os: ubuntu-22.04
            cargo_args: --no-default-features
          # macOS gets Metal out of the box.
          - os: macos-latest
            cargo_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Windows only: an empty LIBCLANG_PATH elsewhere makes bindgen look nowhere else
      # («Unable to find libclang ... invalid: []»).
      - name: libclang
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libclang-dev libasound2-dev patchelf
      # The voice program is separate (whisper.cpp and llama.cpp cannot share a binary):
      # built first, then bundled as a sidecar with espeak-ng's pronunciation data.
      - name: Voice program
        shell: bash
        run: |
          cargo build --release -p homellm-voice
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p crates/homellm-app/binaries crates/homellm-app/voice
          cp "target/release/homellm-voice$ext" "crates/homellm-app/binaries/homellm-voice-$triple$ext"
          data=$(ls -d target/release/build/espeak-rs-sys-*/out/share/espeak-ng-data | head -1)
          cp -r "$data" crates/homellm-app/voice/
      - name: Build installers
        working-directory: crates/homellm-app
        shell: bash
        run: npx --yes @tauri-apps/cli@2.12.0 build --config tauri.voice.conf.json -- ${{ matrix.cargo_args }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: HomeLLM ${{ github.ref_name }}
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/dmg/*.dmg
