[package]
name = "homellm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "homellm"
path = "src/main.rs"

[features]
default = ["llama"]
llama = ["homellm-core/llama"]
cuda = ["homellm-core/cuda"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
homellm-core = { path = "../homellm-core", default-features = false }
serde_json.workspace = true
tokio.workspace = true
