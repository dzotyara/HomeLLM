<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>HomeLLM — питомец</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #pet { width: 100%; height: 100%; display: grid; place-items: center; cursor: grab; }
  svg { width: 96px; height: 96px; overflow: visible; animation: bob 3s ease-in-out infinite; filter: drop-shadow(0 4px 6px rgb(0 0 0 / .35)); }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .dots, .zzz { opacity: 0; transition: opacity .3s; }
  .dot { animation: jump 1s infinite; }
  .dot:nth-child(2) { animation-delay: .15s; } .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes jump { 30% { transform: translateY(-3px); } }
  .thinking .dots { opacity: 1; }
  .thinking .eyes { opacity: 0; }
  .happy svg { animation: hop .6s ease-out 2; }
  @keyframes hop { 40% { transform: translateY(-14px) scale(1.05, .95); } }
  .sleeping svg { animation: none; transform: translateY(3px); }
  .sleeping .eye { animation: none; transform: scaleY(.12); }
  .sleeping .zzz { opacity: 1; }
  .zzz text { font: 700 11px system-ui; fill: #5fd4a4; animation: rise 3s infinite; }
  .zzz text:nth-child(2) { animation-delay: 1s; } .zzz text:nth-child(3) { animation-delay: 2s; }
  @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(8px, -16px); opacity: 0; } }
</style>
</head>
<body>
<div id="pet" data-tauri-drag-region title="HomeLLM — двойной клик, чтобы открыть">
  <svg viewBox="0 0 32 32" data-tauri-drag-region>
    <path d="M16 3.6 27.3 13.4V23a2.4 2.4 0 0 1-2.4 2.4H13.1L8.4 29l.5-3.8A2.4 2.4 0 0 1 4.7 23v-9.6z" fill="#5fd4a4" stroke="#141f1b" stroke-width=".8"/>
    <g class="eyes"><ellipse class="eye" cx="12.4" cy="17.4" rx="1.6" ry="2" fill="#141f1b"/><ellipse class="eye" cx="19.6" cy="17.4" rx="1.6" ry="2" fill="#141f1b"/></g>
    <g class="dots" fill="#141f1b"><circle class="dot" cx="11.8" cy="17.6" r="1.4"/><circle class="dot" cx="16" cy="17.6" r="1.4"/><circle class="dot" cx="20.2" cy="17.6" r="1.4"/></g>
    <g class="zzz"><text x="24" y="8">z</text><text x="26" y="6">z</text><text x="28" y="4">z</text></g>
  </svg>
</div>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const pet = document.getElementById("pet");
  let idle;

  function mood(state, ms) {
    pet.className = state;
    clearTimeout(idle);
    // Back to calm after a while, asleep after two quiet minutes.
    idle = setTimeout(() => {
      pet.className = "";
      idle = setTimeout(() => (pet.className = "sleeping"), 120000);
    }, ms);
  }

  listen("token", () => mood("thinking", 1500));
  listen("tool-result", () => mood("happy", 1400));
  listen("reminder", () => mood("happy", 3000));
  pet.addEventListener("dblclick", () => invoke("show_main_window"));
  mood("", 1000);
</script>
</body>
</html>
