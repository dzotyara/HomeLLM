[package]
name = "homellm-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# GPU inference: Vulkan on Windows/Linux, Metal on macOS. `--no-default-features` = CPU only.
default = ["gpu"]
gpu = ["homellm-core/llama"]
cuda = ["homellm-core/cuda"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
directories.workspace = true
homellm-core = { path = "../homellm-core", default-features = false, features = ["llama-cpu"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.6"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-notification = "2.5"
tokio.workspace = true
