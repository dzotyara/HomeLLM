[package]
name = "homellm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["llama"]
# Built-in inference through llama.cpp on the GPU: Vulkan on Windows/Linux (any NVIDIA, AMD or
# Intel card; building needs the Vulkan SDK), Metal on macOS.
llama = ["llama-cpu", "dep:llama-cpp-sys-2"]
# llama.cpp on the CPU only: no GPU SDK needed to build. mtmd: pictures through a vision projector.
llama-cpu = ["dep:llama-cpp-2", "llama-cpp-2/mtmd", "dep:encoding_rs"]
# CUDA instead of Vulkan for the last bit of speed on NVIDIA (needs the CUDA Toolkit).
cuda = ["llama-cpu", "llama-cpp-2/cuda"]

[dependencies]
anyhow.workspace = true
arboard.workspace = true
chrono.workspace = true
async-trait.workspace = true
base64 = "0.22"
directories.workspace = true
encoding_rs = { version = "0.8", optional = true }
enigo.workspace = true
futures-util.workspace = true
getrandom = "0.3"
llama-cpp-2 = { workspace = true, optional = true }
open.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tokio.workspace = true
ureq.workspace = true

# «What plays now» from Windows' media overlay, whatever the player.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Media_Control"] }

# llama-cpp-2 does not re-export the Vulkan switch: enable it on the sys crate directly.
[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-sys-2 = { version = "0.1.157", optional = true, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, optional = true, features = ["metal"] }
